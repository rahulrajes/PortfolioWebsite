<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>R. Rajesh</title>
  <meta name="description" content="Rahul Rajesh — student, researcher, and photographer at ASU." />

  <!-- Always load in light mode; clear any stored preference -->
  <script>localStorage.removeItem("theme");</script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />

  <!-- The six sections: single source of truth, read by both scripts below -->
  <script>
    window.RR_SECTIONS = [
      { label: "About",       href: "about.html" },
      { label: "Academic",    href: "academic.html" },
      { label: "Photography", href: "photography.html" },
      { label: "Journey",     href: "journey.html" },
      { label: "Blog",        href: "blogs.html" },
      { label: "Rahul.AI",    href: "rahul-ai.html" }
    ];
  </script>

  <!-- Three.js via a native ES-module import map (no build tools) -->
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <!-- GSAP as a global (used for the reveal + eased motion) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>

<body class="is-loading">

  <div id="theme-transition"></div>

  <!-- Lightbulb that drops on a rope during the light->dark transition -->
  <div id="lightbulb" role="button" tabindex="0" aria-label="Toggle light and dark mode">
    <div class="bulb-rope"></div>
    <svg class="bulb-glass" viewBox="0 0 64 96" aria-hidden="true">
      <path d="M32 6C18 6 8 16 8 30c0 9 5 16 11 21 2 2 3 4 3 7h20c0-3 1-5 3-7 6-5 11-12 11-21C56 16 46 6 32 6Z" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <rect x="22" y="66" width="20" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <path d="M26 82h12M28 88h8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- ===================== PRELOADER =====================
       A full-screen veil holding the circular progress ring that fills as the
       % counts up. The name is a SEPARATE .wordmark element (below) so it can
       morph into the top masthead on reveal instead of being trapped here. -->
  <div class="preloader" id="preloader">
    <div class="loader-ring">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="loader-ring__track" cx="60" cy="60" r="54" />
        <circle class="loader-ring__bar"   id="loaderBar" cx="60" cy="60" r="54" />
      </svg>
      <div class="loader-ring__pct"><span id="pct">0</span></div>
    </div>
  </div>

  <!-- ===================== WORDMARK =====================
       Centered + large during load; on reveal it rises onto the drum's top rim
       and curves in 3D (per-letter, so the ends bow outward). The "j" uses the
       dotless glyph "ȷ" (U+0237); "ajes" carry .bar for the line over them. -->

  <div class="wordmark-loading" aria-hidden="true">
    R. Rajesh
  </div>

  <div class="hero-video">
    <video id="heroVideo" autoplay muted loop playsinline>
        <source src="assets/video/light.mp4" type="video/mp4">
    </video>
  </div>

  <div class="wordmark" id="wordmark" aria-label="R. Rajesh">
    <span class="wordmark__curve" aria-hidden="true"><span class="ch">R</span><span class="ch">.</span><span class="ch ch--sp"></span><span class="ch">R</span><span class="ch bar">a</span><span class="ch bar">ȷ</span><span class="ch bar">e</span><span class="ch bar">s</span><span class="ch">h</span></span>
  </div>

  <!-- ===================== DARK-MODE TOGGLE (corner) ===================== -->
  <button class="mode-toggle" id="theme-toggle" type="button" aria-label="Switch theme">
    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M12 3 a9 9 0 0 1 0 18 z" fill="currentColor"/>
    </svg>
    <svg class="icon-bulb" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1 1.1 1.6l.2 1.5h4.4l.2-1.5c.1-.6.5-1.2 1.1-1.6A6 6 0 0 0 12 3Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M10 19h4M10.5 21h3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </button>

  <!-- ===================== WEBGL STAGE =====================
       Fixed, full-viewport. The thin drum rotates as you scroll; the active
       section's name is crisp HTML (not painted on the curved panel, so it
       never warps) and cross-fades as the drum turns. -->
  <div class="stage">
    <canvas id="scene" class="scene-canvas"></canvas>
    <div class="floor-sheen" aria-hidden="true"></div>
    <div class="section-name">
      <div class="section-name__label" id="sectionTitle">About</div>
      <button class="view-btn" id="viewBtn" type="button">View</button>
    </div>
  </div>

  <!-- A quiet, self-dismissing hint that scrolling spins the drum -->
  <div class="scroll-hint" id="scrollHint" aria-hidden="true">Scroll to spin</div>

  <!-- ===================== DOCK ===================== -->
  <div class="dock" aria-label="Section navigator">
    <div class="dock__main">
      <div class="dock__thumb" id="dockThumb" aria-hidden="true">01</div>
      <div class="dock__meta">
        <span class="dock__hint">Category</span>
        <span class="dock__label" id="dockLabel">About</span>
      </div>
      <button class="dock__arrow" id="prevBtn" type="button" aria-label="Previous section">&lsaquo;</button>
      <button class="dock__arrow" id="nextBtn" type="button" aria-label="Next section">&rsaquo;</button>
    </div>

    <button class="dock__enter" id="enterBtn" type="button" aria-label="Open this section">
      <svg class="dock__ring" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="30" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 7" />
      </svg>
      <span class="dock__enter-mark" aria-hidden="true">&nearr;</span>
    </button>
  </div>

  <!-- Theme + preloader + dock (plain script, also used on section pages) -->
  <script src="js/main.js"></script>
  <!-- The Three.js scene (module; only runs on this page) -->
  <script type="module" src="js/scene.js"></script>
</body>
</html>
